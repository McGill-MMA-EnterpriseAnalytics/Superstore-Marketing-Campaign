[tool.poetry]
name = "superstore-marketing-campaign"
version = "0.1.0"
description = "ML pipeline for Superstore marketing campaign"
authors = ["Arturo Medina <arturo-mn@outlook.com>"]
license = "MIT"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
mlflow = "^2.21.3"
optuna = "^4.3.0"
seaborn = "^0.13.2"
catboost = "^1.2.8"
matplotlib = "^3.10.1"
pandas = "^2.2.3"
numpy = ">=1.22,<2.1"
scikit-learn = "^1.6.1"
xgboost = "^3.0.0"
lightgbm = "^4.6.0"
joblib = "^1.4.2"
PyYAML = "^6.0.2"
scipy = "^1.15.2"
causalml = ">=0.15.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.7"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 130
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
]
[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "U"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "F401", "I001"]
"**/*.ipynb" = ["ALL"]
